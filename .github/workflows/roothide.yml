name: "Dopamine-2.4.9.24-Stealth-Patcher"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Original 2.4.9.24 (Power Mode)
        run: |
          # Tải bản 2.4.9.24 mới nhất từ link trực tiếp
          curl -fSL -A "Mozilla/5.0" -o Dopamine.tipa "https://github.com"
          
          # Kiểm tra dung lượng, nếu lỗi (HTML) thì dùng link dự phòng ghproxy
          FILESIZE=$(stat -f%z Dopamine.tipa)
          if [ $FILESIZE -lt 1000000 ]; then
            echo "Phát hiện file lỗi, đang thử link dự phòng qua Proxy..."
            curl -fSL -o Dopamine.tipa "https://ghproxy.net/https://github.com"
          fi
          
          ls -lh Dopamine.tipa

      - name: Patch and Repack
        run: |
          unzip -q Dopamine.tipa -d temp_folder
          APP_PATH=$(find temp_folder/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_PATH/Info.plist"
          
          # Đổi tên và ID ẩn danh (com.apple...)
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$INFO_PLIST"
          
          # Đóng gói lại thành file mới
          cd temp_folder
          zip -qr ../SystemHealth_2.4.9.24.tipa Payload
          
      - name: Upload Final Product
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-2.4.9.24-Stealth
          path: SystemHealth_2.4.9.24.tipa
