name: "Dopamine-Roothide-Hardcore-Stealth"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Procursus & Tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Fix Permissions
        run: |
          sudo chown -R $(id -u):$(id -g) /opt/procursus
          sudo chmod -R 755 /opt/procursus

      - name: Install THEOS
        run: |
          set -x
          git clone --recursive https://github.com $HOME/theos
          curl -L https://github.com -o $HOME/theos/sdks/sdk.tar.xz
          tar -xf $HOME/theos/sdks/sdk.tar.xz -C $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: HARDCORE STEALTH MODIFICATIONS
        run: |
          set -x
          # 1. Đổi Bundle ID toàn hệ thống
          find . -type f \( -name "Makefile" -o -name "*.plist" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/com.opa334.Dopamine/com.apple.kernel.health-check/g' {} +
          find . -type f \( -name "Makefile" -o -name "*.plist" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/com.roothide.Dopamine/com.apple.kernel.health-check/g' {} +

          # 2. Đổi Binary Name & Display Name
          find . -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "System Health" {} +
          find . -name "Info.plist" -exec plutil -replace CFBundleExecutable -string "SystemHealth" {} +
          # Sửa tên Binary trong Makefile
          sed -i '' 's/Dopamine_FILES/SystemHealth_FILES/g' Application/Dopamine/Makefile

          # 3. Obfuscate Strings (jailbreak -> syscheck)
          find . -type f \( -name "*.m" -o -name "*.mm" -o -name "*.h" \) -exec sed -i '' 's/jailbreak/syscheck/g' {} +
          find . -type f \( -name "*.m" -o -name "*.mm" -o -name "*.h" \) -exec sed -i '' 's/Jailbreak/SysCheck/g' {} +

          # 4. Đổi URL Schemes (dopamine:// hoặc cydia:// -> store://)
          find . -name "Info.plist" -exec sed -i '' 's/dopamine/store/g' {} +

          # 5. Disable Update Check (Redirect to localhost)
          sed -i '' 's|https://githubusercontent.com|http://127.0.0|g' Application/Dopamine/UI/Settings/DOUpdateSettingsController.m 2>/dev/null || true

      - name: Build
        run: |
          export THEOS=$HOME/theos
          sudo rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc
          # Cấp quyền cho gtar đóng gói
          sudo chmod -R 777 .
          make -j$(sysctl -n hw.physicalcpu)
          
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-Stealth
          mv ./Application/Dopamine.tipa ./Application/SystemHealth-Stealth-${VERSION}.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hardcore-Stealth-Dopamine
          path: ./Application/*.tipa
