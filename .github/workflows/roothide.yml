name: "System-Health-CRN-Final-Fix"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Clean TIPA from My Release
        run: |
          # Tải bản sạch bồ vừa up lên Release v1
          gh release download v1 --pattern "Dopamine.tipa" --repo ${{ github.repository }}
          ls -lh Dopamine.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Advanced Patching (Fix Binary - Ditto Mode)
        run: |
          set -x
          # Dùng ditto để giải nén giúp giữ nguyên cấu trúc symlink và quyền hạn file
          mkdir temp
          ditto -xk Dopamine.tipa temp
          
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          BINARY_PATH="$APP_PATH/Dopamine"
          INFO_PLIST="$APP_PATH/Info.plist"
          chmod +x "$BINARY_PATH"

          # Phẫu thuật bằng Python trên file đã được giải nén đúng cách
          python3 - <<EOF
          with open("$BINARY_PATH", "rb") as f:
              data = f.read()
          data = data.replace(b"com.opa334.Dopamine-roothide", b"com.apple.kernel.Senne-hide")
          data = data.replace(b"patchBasebin", b"senneBasebin")
          data = data.replace(b"TweakInject", b"SenneInject")
          with open("$BINARY_PATH", "wb") as f:
              f.write(data)
          EOF

          # Kiểm tra lại - Lần này ditto đã cứu file, strings sẽ đọc được
          strings "$BINARY_PATH" | grep "Senne-hide" && echo "Vá ID: OK" || echo "Vá ID: THẤT BẠI"
          
          # Tàng hình và đổi tên
          mv "$BINARY_PATH" "$APP_PATH/SystemHealth"
          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.Senne-check" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"

          
          # Fake Store URL & Icon
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.kernel.Senne-check</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > "$APP_PATH/AppIcon60x60@3x.png"
          cp "$APP_PATH/AppIcon60x60@3x.png" "$APP_PATH/AppIcon60x60@2x.png"

      - name: Repackaging
        run: |
          cd temp && zip -qr ../SystemHealth_CRN_Final.tipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-CRN-Final
          path: SystemHealth_CRN_Final.tipa
