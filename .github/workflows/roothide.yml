name: "Dopamine-Deep-Stealth-Patcher-2026"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download from Release v1
        run: |
          # Lấy file gốc 52MB từ kho lưu trữ an toàn của bồ
          gh release download v1 -p "Dopamine.tipa" --repo Lam-aka-93/Dopamine2-roothide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deep Patching (Hardcore Stealth)
        run: |
          unzip -q Dopamine.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_PATH/Info.plist"
          
          # 1. Đổi danh tính Apple (Ẩn danh tuyệt đối)
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$INFO_PLIST"
          
          # 2. Đổi tên Binary vật lý (Dopamine -> SystemHealth)
          mv "$APP_PATH/Dopamine" "$APP_PATH/SystemHealth"
          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          
          # 3. Đổi tên hiển thị & URL Schemes
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLSchemes</key><array><string>store</string></array></dict></array>" "$INFO_PLIST"
          
          # 4. Giả mạo phiên bản hệ thống
          plutil -replace CFBundleShortVersionString -string "16.7.10" "$INFO_PLIST"

      - name: Repackaging
        run: |
          cd temp && zip -qr ../SystemHealth_Hardcore_Stealth.tipa Payload
          
      - name: Upload Final Product
        uses: actions/upload-artifact@v4
        with:
          name: Hardcore-Stealth-TIPA
          path: SystemHealth_Hardcore_Stealth.tipa

