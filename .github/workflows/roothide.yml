name: "*** System-Health-Senne-Build ***"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        run: |
          set -x
          git clone --recursive https://github.com ${{ github.workspace }}
          
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://githubusercontent.com >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar

      - name: Build trustcache
        run: |
          set -x
          git clone https://github.com
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Senne Ultimate Mod (Ngoại lệ tầng lõi)
        run: |
          set -x
          # 1. Tạo ngoại lệ cho Senne trong bộ nạp Tweak
          # Tìm tất cả các file mã nguồn và thay thế cơ chế chặn mặc định
          find . -type f \( -name "*.m" -o -name "*.mm" -o -name "*.h" -o -name "*.c" \) -exec sed -i '' 's/com.opa334.Dopamine/com.apple.kernel.Senne/g' {} +
          find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/isBlacklisted/isSenneSafe/g' {} +
          
          # 2. Đổi tên thư mục nạp tweak sang SenneInject để lách lá chắn RootHide
          find . -type f \( -name "*.h" -o -name "*.m" \) -exec sed -i '' 's/TweakInject/SenneInject/g' {} +

          # 3. Đổi tên App hiển thị và ID để tàng hình triệt để
          find . -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "System Health" {} +
          find . -name "Info.plist" -exec plutil -replace CFBundleIdentifier -string "com.apple.kernel.Senne-check" {} +

      - name: Build TIPA
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          # Xóa các file thừa gây lỗi build trên môi trường GitHub
          rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap
          gmake -j$(sysctl -n hw.physicalcpu)
          
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-Senne-Final
          mv ./Application/Dopamine.tipa "./Application/SystemHealth-Senne-${VERSION}.tipa"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Senne-Build
          path: |
            ${{ github.workspace }}/Application/SystemHealth-Senne-*.tipa
