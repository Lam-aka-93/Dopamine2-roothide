name: "Dopamine-Deep-Stealth-Patcher"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Original 2.4.9.24
        run: |
          # Tải bản gốc xịn nhất từ Release bồ đã upload (v1)
          gh release download v1 -p "Dopamine.tipa" --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deep Patching (Sửa nhân, không cần build)
        run: |
          unzip -q Dopamine.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_PATH/Info.plist"
          
          # 1. Đổi Bundle ID sang com.apple.kernel.health-check
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$INFO_PLIST"
          
          # 2. Đổi Binary Name (Tên file thực thi bên trong)
          # Đổi tên file vật lý trước
          mv "$APP_PATH/Dopamine" "$APP_PATH/SystemHealth"
          # Cập nhật vào Info.plist để app biết file chạy tên gì
          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          
          # 3. Đổi Tên hiển thị & URL Schemes (cydia://, dopamine:// -> store://)
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          # Sửa URL Scheme trong mảng
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLSchemes</key><array><string>store</string></array></dict></array>" "$INFO_PLIST"
          
          # 4. Sửa các chuỗi nhạy cảm (Obfuscation cơ bản trong Info)
          plutil -replace CFBundleShortVersionString -string "16.7.10" "$INFO_PLIST"

      - name: Final Repack
        run: |
          cd temp && zip -qr ../Hardcore_Stealth_SystemHealth.tipa Payload
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Hardcore-Stealth-Edition
          path: Hardcore_Stealth_SystemHealth.tipa


