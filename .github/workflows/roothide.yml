name: "Dopamine-Release-Patcher-Final"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download from your Release
        run: |
          # Tớ đã điền link trực tiếp đến Repo của bồ để tránh lỗi ngoặc nhọn
          curl -L "https://github.com" -o original.tipa
          ls -lh original.tipa

      - name: Patching Stealth Info
        run: |
          unzip -q original.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_PATH/Info.plist"
          
          # Đổi tên và ID ẩn danh
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$INFO_PLIST"
          plutil -replace CFBundleShortVersionString -string "16.7.10" "$INFO_PLIST"
          
          cd temp && zip -qr ../SystemHealth_Fixed.tipa Payload
          
      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Dopamine-2.4.9.24
          path: SystemHealth_Fixed.tipa
