name: "System-Health-Gear-Pro-Final-Fix"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Original TIPA
        run: |
          gh release download v1 -p "Dopamine.tipa" --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deep Patching (Hardcore Stealth + Icon Force Load)
        run: |
          set -x
          unzip -q Dopamine.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_PATH/Info.plist"
          
          # 1. GIỮ NGUYÊN KHUNG ỔN ĐỊNH CỦA BỒ
          find temp -name "*.plist" -exec plutil -replace CFBundleShortVersionString -string "2.4.9.24" {} +
          find temp -name "*.plist" -exec plutil -replace CFBundleVersion -string "2.4.9.24" {} +
          
          mv "$APP_PATH/Dopamine" "$APP_PATH/SystemHealth"
          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          
          # 2. CẢI TIẾN URL SCHEME (Dạng mảng chuẩn Apple)
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLSchemes</key><array><string>store</string></array></dict></array>" "$INFO_PLIST"

          # 3. CHIẾN THUẬT ICON 2026 (Fix trắng lưới)
          # Xóa sạch khai báo cũ
          plutil -remove CFBundleIcons "$INFO_PLIST" 2>/dev/null || true
          find "$APP_PATH" -name "AppIcon*.png" -delete 2>/dev/null || true

          # Lấy icon Bánh răng từ hệ thống Mac và ép về chuẩn PNG 180x180
          GEAR_ICON="/System/Applications/System Settings.app/Contents/Resources/AppIcon.icns"
          sips -s format png "$GEAR_ICON" --out "$APP_PATH/AppIcon60x60@3x.png" --resampleHeightWidth 180 180
          cp "$APP_PATH/AppIcon60x60@3x.png" "$APP_PATH/AppIcon60x60@2x.png"

          # KHAI BÁO SIÊU CHI TIẾT (Để iOS 15 không thể từ chối)
          plutil -insert CFBundleIcons -xml "<dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array><key>CFBundleIconName</key><string>AppIcon</string></dict></dict>" "$INFO_PLIST"
          
          # Thêm quyền đặc biệt để iOS ưu tiên load Icon này
          plutil -replace UIPrerenderedIcon -bool true "$INFO_PLIST"

      - name: Repackaging
        run: |
          cd temp && zip -qr ../SystemHealth_Gear_Pro.tipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Gear-Pro
          path: SystemHealth_Gear_Pro.tipa
