name: "System-Health-Senne-V2-Final"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Original TIPA
        run: |
          gh release download v1 -p "Dopamine.tipa" --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Advanced Patching (Senne + Store URL + Stealth)
        run: |
          set -x
          unzip -q Dopamine.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          BINARY_PATH="$APP_PATH/Dopamine"
          INFO_PLIST="$APP_PATH/Info.plist"
          
          # 1. ÉP NẠP: Mở "vùng xanh" cho tên Senne (khớp 100% file bồ vá)
          chmod +x "$BINARY_PATH"
          LC_ALL=C sed -i '' 's/is_blacklisted/Senne/g' "$BINARY_PATH"
          
          # 2. TÀNG HÌNH BINARY GIẢ DANH HỆ THỐNG
          mv "$BINARY_PATH" "$APP_PATH/SystemHealth"
          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.Senne-check" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          
          # 3. FAKE URL SCHEME STORE (Đánh lừa các app ngân hàng quét URL)
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.kernel.Senne-check</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          
          # 4. FIX ICON BÁNH RĂNG (Sửa lỗi icon đen)
          plutil -remove CFBundleIcons "$INFO_PLIST" 2>/dev/null || true
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > "$APP_PATH/AppIcon60x60@3x.png"
          cp "$APP_PATH/AppIcon60x60@3x.png" "$APP_PATH/AppIcon60x60@2x.png"
          plutil -insert CFBundleIcons -xml "<dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array><key>UIPrerenderedIcon</key><true/></dict></dict>" "$INFO_PLIST"

      - name: Repackaging
        run: |
          cd temp && zip -qr ../SystemHealth_Senne_Final.tipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Senne-V2
          path: SystemHealth_Senne_Final.tipa
